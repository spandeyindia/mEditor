name: mEditor CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain
        run: cargo --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Test workspace crates
        run: cargo test -p meditor-core -p meditor-shell -p meditor-gui -- --test-threads=1

      - name: Build GUI
        run: cargo build -p meditor-gui

      - name: Build local package
        if: runner.os != 'Windows'
        run: bash packaging/build-local-package.sh

      - name: Verify package scripts
        if: runner.os != 'Windows'
        run: bash packaging/verify-cross-platform-package.sh
